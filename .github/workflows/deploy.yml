name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, but don't cancel one mid-flight either — a
# half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24+ strips TypeScript types without a flag, which `npm test` relies on.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /fuglanofn
          # Set this to the R2 bucket's public origin once it exists:
          #   gh variable set IMAGE_BASE --body "https://pub-….r2.dev"
          # Until then the site builds and deploys with placeholders rather than
          # ~10.700 broken images, because the image cache is not in the repo.
          NEXT_PUBLIC_IMAGE_BASE: ${{ vars.IMAGE_BASE }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
